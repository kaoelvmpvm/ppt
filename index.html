<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2837">
<title>選擇投影片｜教學與講演簡報</title>
<style>
:root{--bg:#182436;--ink:#fbf5ed;--gold:#debf93;--muted:#b7c2cd}
*{box-sizing:border-box}
body{margin:0;background:#172335;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 78% 8%,#5b476b66,transparent 49%),radial-gradient(ellipse at 12% 95%,#437e6766,transparent 55%);pointer-events:none}
header{padding:45px clamp(22px,5vw,82px) 0;max-width:1560px;margin:0 auto}
.brand{display:flex;gap:14px;align-items:center;color:#d6cbbb}
.brand-mark{width:47px;height:47px;border:1px solid #c8ad8599;border-radius:14px;display:grid;place-items:center;color:#e4c49b;font:800 23px Georgia}
.brand strong{font-size:16px;letter-spacing:.07em}
.brand small{display:block;font-size:12px;letter-spacing:.13em;color:#aeb9c3;margin-top:3px}
main{max-width:1560px;margin:0 auto;padding:54px clamp(22px,5vw,82px) 85px}
.eyebrow{color:#dcb68f;letter-spacing:.18em;font-weight:800;font-size:14px;margin:0 0 15px}
h1{font:800 clamp(48px,5vw,85px)/1.18 "Noto Serif TC","Noto Serif CJK TC",serif;margin:0 0 22px;letter-spacing:.01em}
.subhead{font-size:20px;color:#bac4cf;line-height:1.9;max-width:900px;margin:0 0 52px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-bottom:20px}
.section-head h2{font-size:23px;font-weight:800;margin:0}
.count{font-size:13px;color:#b7bfcb}
.decks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:25px}
.deck{display:block;text-decoration:none;color:inherit;border:1px solid #b1aa9e63;background:#26354b;border-radius:24px;overflow:hidden;box-shadow:0 18px 45px #0003;transition:transform .25s,border-color .25s,box-shadow .25s;outline-offset:5px}
.deck:hover,.deck:focus-visible{transform:translateY(-6px);border-color:#e7c7a0;box-shadow:0 28px 55px #0006}
.visual{position:relative;min-height:268px;display:flex;align-items:center;justify-content:center;overflow:hidden;isolation:isolate}
.deck.rose .visual{background:radial-gradient(circle at 68% 22%,#b38a9d,#654960 55%,#493a57)}
.deck.green .visual{background:radial-gradient(circle at 68% 22%,#6aa28a,#255346 60%,#203b3b)}
.deck:not(.rose):not(.green) .visual{background:linear-gradient(130deg,#74627c,#394c6b)}
.visual::before{content:"";position:absolute;z-index:-1;width:410px;height:410px;border:1px solid #ffffff3c;border-radius:50%;right:-130px;top:-150px}
.bigletters{font:900 110px Georgia,serif;color:#fff3e8;text-shadow:0 15px 40px #24203433;letter-spacing:.01em}
.deck.green .bigletters{font-size:104px}
.illustration{position:absolute;width:70%;height:108%;object-fit:contain;object-position:center bottom;right:-9%;bottom:-19%;filter:drop-shadow(0 14px 15px #0004);pointer-events:none}
.illustration.prince{height:110%;width:48%;right:8%;bottom:-19%}
.visual .series{position:absolute;top:22px;left:24px;font:800 13px Georgia,sans-serif;letter-spacing:.12em;color:#ffffffcc}
.visual .symbol{position:absolute;left:33px;bottom:19px;font-size:28px;color:#ffedc4a8}
.deck-body{padding:26px 30px 31px;background:#fff9f1;color:#2a3441;min-height:240px}
.deck-body .cat{color:#9c6480;font-size:12px;font-weight:900;letter-spacing:.14em;margin-bottom:12px}
.deck.green .deck-body .cat{color:#388069}
.deck-body h3{font:800 34px/1.34 "Noto Serif TC",serif;margin:0 0 8px}
.deck-body .subtitle{font-size:17px;font-weight:800;color:#5b5e70;margin:0 0 17px}
.deck-body p{font-size:15px;line-height:1.8;color:#777d85;min-height:55px;margin:0 0 18px}
.open-line{display:flex;justify-content:space-between;align-items:center;gap:15px;font-size:14px;font-weight:900;color:#776081;border-top:1px solid #e5d9cb;padding-top:17px}
.deck.green .open-line{color:#43806f}
footer{max-width:1560px;margin:0 auto;padding:0 clamp(22px,5vw,82px) 38px;color:#9eaab6;font-size:13px;line-height:1.85}
.empty{border:1px dashed #b7b1bb77;border-radius:17px;padding:28px}
@media(max-width:910px){.decks{grid-template-columns:1fr}.visual{min-height:225px}.subhead{font-size:17px}main{padding-top:42px}.deck-body{min-height:0}}
@media(max-width:540px){.visual{min-height:200px}.bigletters{font-size:75px}.deck.green .bigletters{font-size:72px}.deck-body{padding:22px}.deck-body h3{font-size:28px}.illustration.prince{height:125%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="brand"><div class="brand-mark">P</div><div><strong>板橋國中｜高勳頊老師</strong><small>PRESENTATION LIBRARY</small></div></div></header>
<main>
  <p class="eyebrow">PRESENTATION SELECTOR</p>
  <h1>選擇投影片</h1>
  <p class="subhead">從這裡開啟不同的教學與講演簡報。每份講稿都會保留為獨立頁面，可直接投影、全螢幕播放及返回選單。</p>
  <div class="section-head"><h2>簡報資料庫</h2><span class="count" id="count"></span></div>
  <div id="decks" class="decks" aria-label="可選擇的投影片"></div>
</main>
<footer>所有簡報皆為獨立 HTML。新增簡報只需放入 decks 資料夾，再登記於 decks/catalog.js，原有簡報不會被覆蓋。</footer>
<script src="./decks/catalog.js?v=1"></script>
<script>
(function(){
"use strict";
const list=document.getElementById("decks");
const decks=Array.isArray(window.PPT_DECKS)?window.PPT_DECKS:[];
const text=(tag,cls,value)=>{const n=document.createElement(tag);if(cls)n.className=cls;n.textContent=value||"";return n};
const makeDeck=function(d){
 if(!d||typeof d.path!=="string"||!/^\.\/decks\/[\w-]+\.html$/.test(d.path))return null;
 const a=document.createElement("a");a.href=d.path;a.className="deck "+(d.color==="rose"?"rose":d.color==="green"?"green":"");
 a.setAttribute("aria-label","開啟："+d.title);
 const art=text("div","visual","");
 art.append(text("span","series",d.eyebrow||"PRESENTATION"),text("span","bigletters",d.id==="set"?"SET":d.id==="dodo"?"AI":"PPT"),text("span","symbol",d.id==="set"?"✦":"✧"));
 if(d.id==="set"){
  const img=document.createElement("img");
  img.src="https://kaoelvmpvm.github.io/menstrual-equity-set-jh/assets/characters/prince.png";
  img.alt="";img.decoding="async";img.loading="lazy";img.className="illustration prince";art.append(img);
 }
 const body=text("div","deck-body","");
 body.append(text("div","cat",d.eyebrow||"簡報"),text("h3","",d.title),text("div","subtitle",d.subtitle),text("p","",d.desc));
 const open=text("div","open-line","");open.append(text("span","","開啟這份簡報"),text("span","","↗"));
 body.append(open);a.append(art,body);return a;
};
const valid=decks.map(makeDeck).filter(Boolean);
valid.forEach(a=>list.append(a));
document.getElementById("count").textContent="目前共 "+valid.length+" 份簡報";
if(!valid.length)list.append(text("div","empty","尚未建立簡報。請確認 decks/catalog.js 是否正確載入。"));
})();
</script>
</body>
</html>
